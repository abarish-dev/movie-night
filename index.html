<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16100d">
<title>Movie Night</title>
<style>
:root{
  --bg:#16100d; --bg2:#1f1612; --card:#251a15; --card2:#2d2019; --line:#3d2c23;
  --text:#f4ead9; --muted:#bfae98; --dim:#8d7b68;
  --amber:#f3b545; --amber-soft:rgba(243,181,69,.14); --red:#e0583f; --red-soft:rgba(224,88,63,.16);
  --green:#8fc27a; --green-soft:rgba(143,194,122,.16);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:16px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 var(--sans);
  background-image:radial-gradient(120% 60% at 50% -10%,rgba(243,181,69,.16),transparent 60%),radial-gradient(80% 40% at 100% 0,rgba(224,88,63,.10),transparent 70%);
  background-attachment:fixed;min-height:100vh;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}

/* Marquee header */
header.marquee{padding:calc(18px + env(safe-area-inset-top)) 0 6px;text-align:center}
.sign{display:inline-block;position:relative;padding:14px 26px 12px;border-radius:14px;
  background:linear-gradient(#2a1c15,#1d140f);border:2px solid #5a3d27;
  box-shadow:0 0 0 6px #1a120e,0 0 0 8px #4a3220,0 10px 40px rgba(243,181,69,.15)}
.sign::before,.sign::after{content:"";position:absolute;left:12px;right:12px;height:8px;
  background:radial-gradient(circle,#ffd98a 0 2.5px,rgba(255,217,138,.25) 3px,transparent 4.5px) 0 0/18px 8px repeat-x;
  filter:drop-shadow(0 0 3px rgba(255,200,90,.8))}
.sign::before{top:4px}.sign::after{bottom:4px}
.sign h1{margin:6px 0 2px;font:700 clamp(2rem,8vw,3rem)/1 var(--serif);letter-spacing:.02em;color:#ffe3a6;
  text-shadow:0 0 18px rgba(243,181,69,.45),0 2px 0 #7a4a1c}
.sign p{margin:6px 0 4px;font:600 .72rem/1 var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.tagline{color:var(--dim);font-size:.85rem;margin:12px 0 0}

/* Sticky tabs */
.bar{position:sticky;top:0;z-index:20;background:rgba(22,16,13,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);margin-top:14px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-height:44px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);
  color:var(--muted);font-weight:600;font-size:.95rem;display:flex;align-items:center;gap:8px}
.tab .n{font-size:.78rem;min-width:22px;padding:1px 7px;border-radius:999px;background:rgba(255,255,255,.07);color:var(--muted)}
.tab[aria-selected="true"]{background:var(--amber);border-color:var(--amber);color:#2a1a08}
.tab[aria-selected="true"] .n{background:rgba(42,26,8,.18);color:#2a1a08}

/* Search + filters */
.controls{padding:14px 0 4px}
.search{position:relative}
.search input{width:100%;min-height:52px;padding:12px 44px 12px 46px;border-radius:14px;border:1px solid var(--line);
  background:var(--card);font-size:1.05rem;color:var(--text)}
.search input::placeholder{color:var(--dim)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);opacity:.7}
.search .x{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:none;color:var(--muted);font-size:1.3rem;display:none}
.search.has .x{display:block}
.searchrow{display:flex;gap:8px}
.searchrow .search{flex:1}
.ftoggle{min-width:52px;min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-weight:600;padding:0 14px;display:flex;align-items:center;gap:6px}
.ftoggle .n{background:var(--amber);color:#2a1a08;border-radius:999px;font-size:.75rem;padding:1px 7px}
.ftoggle[aria-expanded="true"]{border-color:var(--amber);color:#ffd88c}
.filters{display:none}
.filters.open{display:block}
@media(min-width:720px){.ftoggle{display:none}.filters{display:block}}
.fgroup{margin-top:14px}
.flabel{font:700 .7rem/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin:0 0 8px 2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:.92rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--amber-soft);border-color:var(--amber);color:#ffd88c}
.chip[aria-pressed="true"]::before{content:"✓ "}
.status{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 0 4px;color:var(--dim);font-size:.9rem;min-height:40px}
.linkbtn{border:0;background:none;color:var(--amber);font-weight:600;padding:10px 4px;min-height:40px}

/* Cards */
.grid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:6px}
@media(min-width:720px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:1040px){.grid{grid-template-columns:1fr 1fr 1fr}}
.card{position:relative;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);
  padding:16px 16px 14px;display:flex;flex-direction:column;gap:10px;overflow:hidden}

.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.78rem;color:var(--dim);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.kind{padding:3px 8px;border-radius:6px;background:rgba(255,255,255,.06);color:var(--muted)}
.who{padding:3px 8px;border-radius:6px;background:var(--red-soft);color:#ffb3a3;text-transform:none;letter-spacing:0}
.card h2{margin:0;font:700 1.4rem/1.15 var(--serif);color:#fff3dd;padding-right:72px}
.perf{position:relative;border-top:2px dashed var(--line);margin:2px -16px}
.perf::before,.perf::after{content:"";position:absolute;top:-10px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.perf::before{left:-10px}.perf::after{right:-10px}
.people{color:var(--muted);font-size:.9rem;margin-top:-4px}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:.9rem;color:var(--text)}
.meta .len{display:inline-flex;align-items:center;gap:6px}
.where{display:inline-flex;flex-wrap:wrap;gap:6px}
.svc{padding:2px 9px;border-radius:6px;border:1px solid rgba(243,181,69,.45);color:#ffd88c;font-size:.82rem;font-weight:600}
.svc.none{border-color:var(--line);color:var(--dim);font-weight:500}
.genres{display:flex;flex-wrap:wrap;gap:6px}
.g{font-size:.78rem;padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.05);color:var(--muted)}
.why{margin:0;font:italic 1.02rem/1.45 var(--serif);color:#efdfc6}
.note{font-size:.88rem;color:#ffd88c;background:var(--amber-soft);border-radius:10px;padding:8px 11px}
.stamp{position:absolute;top:14px;right:12px;transform:rotate(6deg);font:800 .72rem/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;
  padding:6px 8px;border:2px solid;border-radius:6px;opacity:.9}
.stamp.up{color:var(--green);border-color:var(--green)}
.stamp.down{color:var(--red);border-color:var(--red)}
.stamp.watched{color:var(--muted);border-color:var(--muted)}
.actions{display:flex;flex-direction:column;gap:8px;margin-top:auto;padding-top:4px}
.scorerow{display:flex;gap:8px;align-items:center}
.scorerow .lbl{font-size:.82rem;color:var(--dim);margin-left:4px}
.btnrow{display:flex;gap:8px}
.btnrow .act{flex:1}
.thumb{width:52px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);font-size:1.35rem;display:grid;place-items:center;filter:grayscale(.6);opacity:.85}
.thumb[aria-pressed="true"].up{background:var(--green-soft);border-color:var(--green);filter:none;opacity:1}
.thumb[aria-pressed="true"].down{background:var(--red-soft);border-color:var(--red);filter:none;opacity:1}
.act{min-height:48px;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--text);font-weight:600;font-size:.92rem}
.act.primary{background:var(--amber);border-color:var(--amber);color:#2a1a08}
.act.ghost{color:var(--muted)}

.empty{grid-column:1/-1;text-align:center;padding:48px 20px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.empty .big{font:700 1.35rem/1.3 var(--serif);color:#fff3dd;margin:10px 0 6px}
.empty .reel{font-size:2.2rem}

footer{margin:36px 0 0;color:var(--dim);font-size:.85rem;text-align:center;line-height:1.7}
footer button{border:1px solid var(--line);background:var(--bg2);color:var(--muted);border-radius:10px;min-height:40px;padding:6px 12px;margin:4px}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,140%);transition:transform .25s ease;
  background:#f4ead9;color:#2a1a08;border-radius:14px;padding:10px 10px 10px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.5);
  width:max-content;max-width:calc(100% - 24px);z-index:50;font-weight:600}
.toast.show{transform:translate(-50%,0)}
.toast button{border:0;background:#2a1a08;color:#ffd88c;border-radius:10px;min-height:40px;padding:6px 14px;font-weight:700}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

, "Victor Belmondo"], "why": "A light heist comedy: Stanley Tucci, from The Devil Wears Prada, plays a master thief who recruits two strangers to steal the Mona Lisa, then reveals he's their father. Heads-up: it's a French-Italian production.", "bucket": "suggestion", "defaultScore": null, "who": "both", "note": "Streaming now on Prime Video (released Oct 16, 2026). Adam asked to add it.", "lengthLabel": "Movie", "lengthTags": ["movie"]}, {"id": "the-invite", "title": "The Invite", "year": 2026, "kind": "movie", "genres": ["comedy", "relationship", "rom-com"], "runtimeMinutes": 107, "seasons": null, "episodes": null, "episodeMinutes": null, "limited": false, "where": ["HBO Max"], "people": ["Seth Rogen", "Olivia Wilde", "Penélope Cruz", "Edward Norton"], "why": "A sharp, funny marriage comedy: a couple in a rut invite their glamorous upstairs neighbors to dinner, and the night spirals when the neighbors make a spicy proposition. 96% on Rotten Tomatoes and an American remake, so it plays glossy, not foreign. Heads-up: it's an R-rated sex comedy, all talk and no violence.", "bucket": "suggestion", "defaultScore": null, "who": "both", "note": "Streaming now on HBO Max (arrived Fri, Oct 23, 2026).", "lengthLabel": "Movie", "lengthTags": ["movie"]}]};
(function(){
"use strict";
const PREFIX="movienight.v1.title.";
const UI_KEY="movienight.v1.ui";
const TITLES=CATALOG.titles;
const GENRES=[["rom-com","Rom-com"],["relationship","Relationship"],["thriller","Thriller"],["drama","Drama"],["comedy","Comedy"],["feel-good","Feel-good"],["sports","Sports"],["mystery","Mystery"],["documentary","Documentary"]];
const LENGTHS=[["movie","Movie"],["under2h","Under 2 hours"],["short","Short episodes (~30 min)"],["limited","Limited / short run"],["ongoing","Ongoing series"]];
const TABS=[["try","To try"],["watching","Watching now"],["liked","Liked"],["passed","Passed"],["watched","Watched"]];
const GENRE_LABEL=Object.fromEntries(GENRES);

/* ---------- storage (one key per title id, so catalog edits never wipe scores) ---------- */
let canStore=true;
try{localStorage.setItem("movienight.test","1");localStorage.removeItem("movienight.test")}catch(e){canStore=false}
const mem={};
function load(id){
  if(!canStore) return mem[id]||{};
  try{return JSON.parse(localStorage.getItem(PREFIX+id))||{}}catch(e){return {}}
}
function save(id,rec){
  rec.updatedAt=new Date().toISOString();
  if(!canStore){mem[id]=rec;return}
  try{localStorage.setItem(PREFIX+id,JSON.stringify(rec))}catch(e){mem[id]=rec}
}
function state(t){
  const r=load(t.id);
  const score = ("score" in r) ? (r.score==="none"?null:r.score) : (t.defaultScore||null);
  const watching = ("watching" in r) ? !!r.watching : t.bucket==="watching";
  const watched = !!r.watched;
  return {score,watching,watched};
}
function inTab(t,s,tab){
  switch(tab){
    case "try": return t.bucket==="suggestion" && !s.watching && !s.watched && s.score!=="down";
    case "watching": return s.watching && !s.watched && s.score!=="down";
    case "liked": return s.score==="up";
    case "passed": return s.score==="down";
    case "watched": return s.watched;
  }
  return false;
}

/* ---------- ui state ---------- */
let ui={tab:"try",q:"",genres:[],lengths:[]};
try{const u=JSON.parse(sessionStorage.getItem(UI_KEY));if(u)ui=Object.assign(ui,u)}catch(e){}
function saveUi(){try{sessionStorage.setItem(UI_KEY,JSON.stringify(ui))}catch(e){}}

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");

function haystack(t){
  return norm([t.title,t.year,t.kind,(t.people||[]).join(" "),t.why,t.note,(t.genres||[]).map(g=>g+" "+(GENRE_LABEL[g]||"")).join(" "),
    (t.where||[]).join(" "),t.lengthLabel,t.who==="kim"?"kim kimberley":t.who==="adam"?"adam":"",
    (t.lengthTags||[]).includes("short")?"short half hour quick":"",(t.lengthTags||[]).includes("limited")?"limited miniseries":""].join(" "));
}
const HAY=Object.fromEntries(TITLES.map(t=>[t.id,haystack(t)]));

function matches(t){
  if(ui.q){
    const words=norm(ui.q).split(/\s+/).filter(Boolean);
    if(!words.every(w=>HAY[t.id].includes(w))) return false;
  }
  if(ui.genres.length && !ui.genres.some(g=>t.genres.includes(g))) return false;
  if(ui.lengths.length && !ui.lengths.some(l=>t.lengthTags.includes(l))) return false;
  return true;
}

/* ---------- render ---------- */
function renderTabs(){
  const counts={};TABS.forEach(([k])=>counts[k]=0);
  TITLES.forEach(t=>{const s=state(t);TABS.forEach(([k])=>{if(inTab(t,s,k))counts[k]++})});
  $("#tabs").innerHTML=TABS.map(([k,l])=>`<button class="tab" role="tab" aria-selected="${ui.tab===k}" data-tab="${k}">${l}<span class="n">${counts[k]}</span></button>`).join("");
}
function renderChips(){
  $("#genreChips").innerHTML=GENRES.map(([k,l])=>`<button class="chip" aria-pressed="${ui.genres.includes(k)}" data-genre="${k}">${l}</button>`).join("");
  $("#lenChips").innerHTML=LENGTHS.map(([k,l])=>`<button class="chip" aria-pressed="${ui.lengths.includes(k)}" data-len="${k}">${l}</button>`).join("");
  $("#searchBox").classList.toggle("has",!!ui.q);
  $("#resetFilters").hidden=!(ui.q||ui.genres.length||ui.lengths.length);
  const fc=ui.genres.length+ui.lengths.length;$("#fcount").hidden=!fc;$("#fcount").textContent=fc;
}
const EMPTY={
  try:["🍿","The queue is empty.","You've either watched everything or passed on it. New picks show up when the list gets its weekly refresh."],
  watching:["📺","Nothing on the go right now.","Find something in To try and tap “Start watching” to park it here."],
  liked:["👍","No thumbs up yet.","Give something a thumbs up after a good night in and it'll live here."],
  passed:["🙅","Nothing passed on.","Generous of you. Thumbs down anything that doesn't work and it'll stop bugging you."],
  watched:["🎟️","Nothing checked off yet.","When you finish something, tap “Watched, remove.” It'll land here with its score."]
};
function card(t){
  const s=state(t);
  const stamp = s.score==="up"?`<span class="stamp up">Liked</span>`:s.score==="down"?`<span class="stamp down">Passed</span>`:s.watched?`<span class="stamp watched">Watched</span>`:"";
  const who = t.who==="kim"?`<span class="who">Kim's pick</span>`:t.who==="adam"?`<span class="who">Adam's pick</span>`:"";
  const where = (t.where&&t.where.length)?t.where.map(w=>`<span class="svc">${esc(w)}</span>`).join(""):`<span class="svc none">Streaming home not confirmed</span>`;
  const lbl = s.score==="up"?"You liked it":s.score==="down"?"You passed":"Tap to score";
  let acts=`<div class="scorerow"><button class="thumb up" data-act="up" aria-pressed="${s.score==="up"}" aria-label="Thumbs up for ${esc(t.title)}" title="Thumbs up">👍</button>
    <button class="thumb down" data-act="down" aria-pressed="${s.score==="down"}" aria-label="Thumbs down for ${esc(t.title)}" title="Thumbs down">👎</button><span class="lbl">${lbl}</span></div>`;
  let btns="";
  if(s.watched){
    btns=`<button class="act ghost" data-act="unwatch">Put back on the list</button>`;
  }else if(t.bucket==="suggestion" && !s.watching){
    btns=`<button class="act" data-act="watching">Start watching</button><button class="act primary" data-act="watched">Watched, remove</button>`;
  }else if(s.watching){
    btns=`<button class="act ghost" data-act="stopwatching">${t.bucket==="watching"?"Not watching":"Back to To try"}</button><button class="act primary" data-act="watched">Watched, remove</button>`;
  }
  if(btns) acts+=`<div class="btnrow">${btns}</div>`;
  return `<article class="card" data-id="${esc(t.id)}">
    ${stamp}
    <div class="top"><span class="kind">${t.kind==="movie"?"Movie":"Series"}</span><span>${esc(t.year)}</span>${who}</div>
    <h2>${esc(t.title)}</h2>
    ${t.people&&t.people.length?`<div class="people">${esc(t.people.join(", "))}</div>`:""}
    <div class="perf" aria-hidden="true"></div>
    <div class="meta"><span class="len">⏱ ${esc(t.lengthLabel)}</span><span class="where">${where}</span></div>
    <div class="genres">${t.genres.map(g=>`<span class="g">${esc(GENRE_LABEL[g]||g)}</span>`).join("")}</div>
    <p class="why">${esc(t.why)}</p>
    ${t.note?`<div class="note">${esc(t.note)}</div>`:""}
    <div class="actions">${acts}</div>
  </article>`;
}
function render(){
  renderTabs();renderChips();
  const list=TITLES.filter(t=>inTab(t,state(t),ui.tab)&&matches(t));
  const total=TITLES.filter(t=>inTab(t,state(t),ui.tab)).length;
  const filtered=ui.q||ui.genres.length||ui.lengths.length;
  $("#count").textContent= filtered?`${list.length} of ${total} showing`:`${total} ${total===1?"title":"titles"}`;
  if(!list.length){
    const e = (filtered&&total)?["🔎","Nothing matches that combo.","Try loosening a filter or searching something broader, like “Kidman” or “wedding.”"]:EMPTY[ui.tab];
    $("#grid").innerHTML=`<div class="empty"><div class="reel">${e[0]}</div><div class="big">${e[1]}</div><div>${e[2]}</div>${filtered&&total?`<button class="linkbtn" data-reset>Clear filters</button>`:""}</div>`;
  }else{
    $("#grid").innerHTML=list.map(card).join("");
  }
  saveUi();
}

/* ---------- actions ---------- */
let undoFn=null,toastTimer=null;
function toast(msg,undo){
  undoFn=undo||null;$("#toastMsg").textContent=msg;$("#toastUndo").hidden=!undo;
  $("#toast").classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>$("#toast").classList.remove("show"),4500);
}
function act(id,a){
  const t=TITLES.find(x=>x.id===id);if(!t)return;
  const before=JSON.stringify(load(id));
  const r=load(id);const s=state(t);
  if(a==="up"||a==="down"){
    r.score = (s.score===a) ? "none" : a;
    save(id,r);
    if(r.score==="down") toast(`Passed on ${t.title}.`,restore);
    else if(r.score==="up") toast(`Thumbs up for ${t.title}.`);
    else toast(`Cleared your score for ${t.title}.`);
  }else if(a==="watched"){
    r.watched=true;r.watchedAt=new Date().toISOString();save(id,r);
    toast(`${t.title} is checked off.`,restore);
  }else if(a==="unwatch"){
    r.watched=false;save(id,r);toast(`${t.title} is back on the list.`);
  }else if(a==="watching"){
    r.watching=true;save(id,r);toast(`${t.title} moved to Watching now.`,restore);
  }else if(a==="stopwatching"){
    r.watching=false;save(id,r);toast(t.bucket==="suggestion"?`${t.title} is back in To try.`:`${t.title} is off Watching now.`,restore);
  }
  function restore(){const o=JSON.parse(before);if(canStore){if(Object.keys(o).length)localStorage.setItem(PREFIX+id,before);else localStorage.removeItem(PREFIX+id)}else mem[id]=o;render()}
  render();
}

document.addEventListener("click",e=>{
  const tab=e.target.closest("[data-tab]");
  if(tab){ui.tab=tab.dataset.tab;render();window.scrollTo({top:Math.min(window.scrollY,document.querySelector(".bar").offsetTop)});return}
  const g=e.target.closest("[data-genre]");
  if(g){const k=g.dataset.genre;ui.genres=ui.genres.includes(k)?ui.genres.filter(x=>x!==k):[...ui.genres,k];render();return}
  const l=e.target.closest("[data-len]");
  if(l){const k=l.dataset.len;ui.lengths=ui.lengths.includes(k)?ui.lengths.filter(x=>x!==k):[...ui.lengths,k];render();return}
  if(e.target.closest("[data-reset]")||e.target.closest("#resetFilters")){ui.q="";ui.genres=[];ui.lengths=[];$("#q").value="";render();return}
  const b=e.target.closest("[data-act]");
  if(b){act(b.closest(".card").dataset.id,b.dataset.act);return}
});
$("#q").value=ui.q;
$("#ftoggle").addEventListener("click",()=>{const o=$("#filters").classList.toggle("open");$("#ftoggle").setAttribute("aria-expanded",o)});
if(ui.genres.length||ui.lengths.length){$("#filters").classList.add("open");$("#ftoggle").setAttribute("aria-expanded","true")}
let qt;$("#q").addEventListener("input",e=>{clearTimeout(qt);qt=setTimeout(()=>{ui.q=e.target.value.trim();render()},120)});
$("#clearQ").addEventListener("click",()=>{ui.q="";$("#q").value="";render();$("#q").focus()});
$("#toastUndo").addEventListener("click",()=>{if(undoFn)undoFn();$("#toast").classList.remove("show")});

/* ---------- export / import scores ---------- */
$("#exportBtn").addEventListener("click",()=>{
  const data={app:"movienight",version:1,exportedAt:new Date().toISOString(),titles:{}};
  TITLES.forEach(t=>{const r=load(t.id);if(Object.keys(r).length)data.titles[t.id]=r});
  if(canStore){for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(PREFIX)){const id=k.slice(PREFIX.length);if(!data.titles[id]){try{data.titles[id]=JSON.parse(localStorage.getItem(k))}catch(e){}}}}}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));
  a.download="movie-night-scores.json";document.body.appendChild(a);a.click();a.remove();
});
$("#importBtn").addEventListener("click",()=>$("#importFile").click());
$("#importFile").addEventListener("change",async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const d=JSON.parse(await f.text());if(d.app!=="movienight"||!d.titles)throw 0;
    let n=0;Object.entries(d.titles).forEach(([id,r])=>{if(r&&typeof r==="object"){save(id,r);n++}});
    toast(`Loaded ${n} saved ${n===1?"score":"scores"}.`);render();
  }catch(err){toast("That file doesn't look like a Movie Night backup.")}
  e.target.value="";
});

const d=new Date(CATALOG.updated+"T12:00:00");
const nice=d.toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"});
$("#tagline").textContent=`Picked for the two of you · list updated ${nice}`;
$("#updated").textContent=`Catalog updated ${nice}. “Where to watch” is US streaming as checked that day.`+(canStore?"":" (This browser won't save scores between visits.)");
render();
})();
</script>
